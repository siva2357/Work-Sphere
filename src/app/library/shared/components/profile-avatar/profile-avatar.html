<div class="dropdown">
    <button class="btn p-0 border-0 d-flex align-items-center gap-2" type="button" id="userProfileDropdown"
        data-bs-toggle="dropdown" aria-expanded="false">
        <img [src]="profileImage" alt="Avatar"
            class="rounded-circle object-fit-cover shadow-sm border" width="38" height="38">
        <div class="d-none d-md-flex flex-column align-items-start ms-1">
            <span class="fw-semibold text-dark lh-1" style="font-size: 14px;">{{ fullName }}</span>
            <span class="text-muted lh-1 mt-1" style="font-size: 11px;">{{ role }}</span>
        </div>
        <i class="bi bi-chevron-down text-secondary" style="font-size: 11px;"></i>
    </button>

    <div class="dropdown-menu dropdown-menu-end p-0 border-0 mt-2 shadow-sm profile-dropdown"
        aria-labelledby="userProfileDropdown" style="min-width: 220px; border-radius: 12px; overflow: hidden;">
        <div class="p-3 bg-light border-bottom d-flex align-items-center gap-3">
            <img [src]="profileImage" alt="Avatar"
                class="rounded-circle object-fit-cover shadow-sm" width="42" height="42">
            <div class="overflow-hidden">
                <div class="fw-bold text-dark text-truncate" style="font-size: 14px;">{{ fullName }}</div>
                <div class="text-muted text-truncate" style="font-size: 12px;">{{ email }}</div>
            </div>
        </div>

        <div class="py-2">
            <a [routerLink]="profileLink" class="dropdown-item py-2 px-3 d-flex align-items-center gap-2">
                <i class="bi bi-person text-success"></i> My Profile
            </a>
            <div class="dropdown-divider my-1"></div>
            <a routerLink="/login" (click)="logout()" class="dropdown-item py-2 px-3 text-danger d-flex align-items-center gap-2">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</div>
